#
# SBOM and license policy, through the org's shared workflow: cargo-cyclonedx for
# the dependency graph, scancode over the sources, the org license policy, and
# the check that NOTICE names every component. A failure uploads the NOTICE the
# SBOM calls for as the `sbom-notice` artifact, to review and commit.
#
# release.yml waits for this check on the tag's commit and attaches the run's
# `sbom` artifact (sbom.json) to the GitHub Release.

name: SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sbom:
    name: SBOM
    permissions:
      contents: read
    uses: EdgeFirstAI/.github/.github/workflows/sbom.yml@0cbb8f91f0d3e7d15726329f3fa651450bfdbbf0 # v5.1.0
    with:
      mode: full
      project-name: tflite-rs
      project-type: library
      version-file: Cargo.toml
      source-dirs: crates examples
      # A graph is resolved per target, so a Linux runner alone misses the
      # target-conditional dependencies of the wheels built for Windows and macOS.
      targets: >-
        x86_64-unknown-linux-gnu
        aarch64-unknown-linux-gnu
        x86_64-pc-windows-msvc
        aarch64-apple-darwin
      # The release reads this artifact after the release PR merges, which is
      # human-paced; the full-mode default is 7 days.
      retention-days: '30'
