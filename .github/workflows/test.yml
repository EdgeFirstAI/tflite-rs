name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master (2026-03-20)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      # yolov8-live links libcamera >= 0.4, which no Ubuntu LTS runner ships;
      # the live-example job lints it in a container that does.
      - name: Run Clippy
        run: cargo clippy --workspace --exclude yolov8-live --all-features --all-targets -- -D warnings

  build-check:
    name: Build Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master (2026-03-20)
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: build-check

      - name: Check workspace (default features)
        run: cargo check --workspace --exclude yolov8-live --all-targets

  live-example:
    name: Lint (yolov8-live)
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install libcamera and build tools
        run: |
          echo "deb http://deb.debian.org/debian trixie-backports main" \
            > /etc/apt/sources.list.d/trixie-backports.list
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang curl git git-lfs libclang-dev pkg-config
          apt-get install -y --no-install-recommends -t trixie-backports libcamera-dev

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master (2026-03-20)
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: live-example

      - name: Run Clippy
        run: cargo clippy -p yolov8-live --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master (2026-03-20)
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c12d62a803cbdfe2e7263af15f5a9548065cb4f2 # v2.69.3
        with:
          tool: cargo-nextest

      - name: Run unit tests (no TFLite runtime in CI)
        run: cargo nextest run -p edgefirst-tflite -p edgefirst-tflite-sys --all-features -E 'kind(lib)'
